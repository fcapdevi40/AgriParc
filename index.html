<style>
:root{--bg:#f8f5ee;--card:#fff;--tx:#1f2a22;--mu:#6b6757;--ac:#d4a42c;--on:#1b3a26;--ac2:#f7edcf;--bd:#e9e3d3;--gr:#17402a;--wa:#b4390c;--wb:#ffe8d6;--nb:rgba(255,253,248,.92);--sh:0 1px 2px rgba(60,45,10,.06),0 10px 24px -14px rgba(60,45,10,.28);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13150f;--card:#1c1f16;--tx:#f1ede0;--mu:#a39e8c;--ac:#e2b73e;--on:#1c1a0c;--ac2:#2d2915;--bd:#2c2f22;--gr:#9bd4a8;--wa:#fdba74;--wb:#3a2515;--nb:rgba(28,31,22,.92);--sh:0 1px 2px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13150f;--card:#1c1f16;--tx:#f1ede0;--mu:#a39e8c;--ac:#e2b73e;--on:#1c1a0c;--ac2:#2d2915;--bd:#2c2f22;--gr:#9bd4a8;--wa:#fdba74;--wb:#3a2515;--nb:rgba(28,31,22,.92);--sh:0 1px 2px rgba(0,0,0,.45);color-scheme:dark}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
img{max-width:100%}
header{background:var(--card);border-bottom:2px solid var(--ac);padding-top:env(safe-area-inset-top,0px)}
.w{max-width:920px;margin:0 auto;padding:0 14px}
h1{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:800;letter-spacing:-.01em;line-height:1.15;color:var(--gr);margin:0;padding:6px 0}
h1 small{display:block;color:var(--mu);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
img.lg{width:34px;height:34px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--bd)}
img.lgf{display:block;width:min(240px,70%);height:auto;margin:0 auto 8px;border-radius:16px;background:#fff}
.hb{display:flex;align-items:center;gap:6px}#sy{font-size:.95rem;white-space:nowrap}#sy .hl{font-size:.72rem;color:var(--mu)}
#msg{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--gr);color:var(--card);padding:10px 14px;border-radius:12px;font-size:.85rem;box-shadow:var(--sh)}#msg:empty{display:none}
.hl{display:none}
@media(min-width:520px){.hl{display:inline}}
@media(max-width:519px){h1 small{display:none}}
main{padding:12px 0 calc(76px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:4px;background:var(--nb);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:130px;display:grid;justify-items:center;gap:1px;background:none;border:0;color:var(--mu);font:inherit;font-size:.68rem;font-weight:600;padding:4px 2px;border-radius:14px;cursor:pointer}
nav button span{display:flex}nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gr);background:var(--ac2)}
.chips{display:grid;gap:6px;margin-bottom:10px}
.chips button{display:grid;gap:2px;justify-items:center;min-width:0;padding:5px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;font:inherit;cursor:pointer;box-shadow:var(--sh)}
.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.ci{display:flex;gap:4px;align-items:baseline;font-size:1rem;line-height:1.1}
.ci em{font-style:normal;font-size:.7rem;font-weight:700;opacity:.75}
.cn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.68rem;font-weight:600}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.g .c{margin:0;background:linear-gradient(160deg,var(--card) 55%,var(--ac2))}
.k{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--gr)}.m{color:var(--mu);font-size:.85rem}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:700;margin:22px 0 8px}
h2.mh{color:var(--gr);font-size:.85rem;display:inline-block;margin:16px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--ac)}
.th{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--mu);margin:8px 0 5px}
.th::before{content:"";width:14px;height:2px;background:var(--ac)}.th i{font-style:normal;opacity:.7}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));align-items:end;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
label{font-size:.75rem;color:var(--mu);font-weight:600;display:grid;gap:4px}
input,select{font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);width:100%;min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.b{border:0;background:var(--ac);color:var(--on);padding:10px 16px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.b:active{transform:scale(.97)}
.b.s{background:var(--ac2);color:var(--tx);border:1px solid var(--bd);padding:10px 14px;font-size:.85rem;font-weight:600}
.b.d{background:transparent;color:var(--wa);border:1px solid var(--bd);padding:10px 14px;font-size:.85rem;font-weight:600}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.t{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ac2);color:var(--gr)}
.t.w{background:var(--wb);color:var(--wa)}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ac),#f1d38a);margin-top:4px}
.hh{width:120px}.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tb .b{padding:13px 8px;font-size:.85rem}
.sr{display:flex;gap:8px;margin-bottom:8px}.sr input{flex:1;min-width:0}.sr select{width:auto;max-width:42%}
.ml{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:6px}
.mr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;cursor:pointer;min-width:0}
.mr:active{background:var(--ac2)}
.mi{display:grid;min-width:0;flex:1}.mi b,.mi .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi .m{font-size:.75rem}.mr .ch{color:var(--mu);font-size:1.2rem}
</style></head><body>

const mrow=m=>{const s=m.iv>0?st(m):null;return`<div class="mr" data-a="fiche" data-id="${m.id}"><div class="mi"><b>${esc(m.nom)}</b><span class="m">${[m.prec,m.an||"",m.prop].filter(Boolean).map(esc).join(" · ")||"—"}</span></div>${s&&s[1]?`<span class="t w">${s[0]}</span>`:""}<span class="ch">›</span></div>`};

return`<div class="m">${ms.length} machine(s)</div>`+S.cats.filter(c=>ok(c.n)).map(c=>{const a=ms.filter(m=>m.cat===c.n);if(!a.length)return"";
const g=[...c.t,""].map(t=>{const b=a.filter(m=>t?m.type===t:!c.t.includes(m.type));return b.length?`<div class="th">${t?esc(t):"Sans type"} <i>${b.length}</i></div><div class="ml">${b.map(mrow).join("")}</div>`:""}).join("");
return`<h2 class="mh">${esc(c.n)} (${a.length})</h2>${g}`}).join("")};
function mach(){if(vid&&mb(vid))return fiche(mb(vid));
const owners=[...new Set(S.m.map(m=>m.prop).filter(Boolean))],sa=editId||pa;
return chips()+`<div class="tb"><button class="b${sa?"":" s"}" data-a="tpa">${editId?"✎ Modification en cours":"＋ Ajouter une machine"}</button><button class="b${mg?"":" s"}" data-a="tmg">⚙ Catégories / types</button></div>`+
(sa?mfm():"")+(mg?`<form id="fl"><label>Je crée…<select name="kind"><option value="cat">une catégorie</option><option value="type">un type</option></select></label><label>Dans la catégorie (pour un type)<select name="pc">${opts(S.cats.map(c=>c.n))}</select></label><label>Nom<input name="nom" required></label><button class="b">Créer</button></form>
<p class="m">Renommez dans les champs, réordonnez avec ↑ ↓ (l’ordre est repris partout), ✕ supprime un élément inutilisé.</p>${mgmt()}`:"")+
`<div class="sr"><input data-q="1" type="search" aria-label="Rechercher une machine" placeholder="🔎 Rechercher une machine…" value="${esc(fq)}"><select data-f="1"><option value="">Tous propriétaires</option>${owners.map(o=>`<option${o===fo?" selected":""}>${esc(o)}</option>`).join("")}</select></div><div id="ml">${mlist()}</div>`}
function fiche(m){const is=hist(S.i.filter(x=>x.mid===m.id)),ps=todo().filter(p=>p.mid===m.id),s=m.iv>0?st(m):null;
return`<div class="ac" style="margin:0 0 10px"><button class="b s" data-a="back">← Retour</button><button class="b s" data-a="em" data-id="${m.id}">✎ Modifier</button><button class="b s" data-a="xl" data-id="${m.id}">⬇ Export Excel</button><button class="b d" data-a="dm" data-id="${m.id}">${armed===m.id?"Confirmer ?":"Supprimer"}</button></div>
<div class="c"><div class="r"><b style="font-size:1.1rem">${esc(m.nom)}</b><span class="t">${esc(m.cat)}</span></div><div class="m">${meta(m)}</div>
<div class="ac"><label>Compteur (${un(m)})<input class="hh" type="number" min="0" data-h="${m.id}" value="${m.h}"></label>${s?`<span class="t ${s[1]?"w":""}">Entretien : ${s[0]}</span><span class="m">tous les ${m.iv} ${un(m)} · dernier à ${m.last}</span><button class="b s" data-a="done" data-id="${m.id}">✔ Entretien fait</button>`:'<span class="m">Pas d’entretien programmé au compteur</span>'}</div></div>
<div class="g"><div class="c"><div class="k">${eur(is.reduce((a,x)=>a+x.c,0))}</div><div class="m">coûts cumulés (${is.length} interventions)</div></div><div class="c"><div class="k">${ps.length}</div><div class="m">à prévoir (${eur(ps.reduce((a,p)=>a+p.c,0))})</div></div></div>
<h2>À prévoir</h2>${ps.map(pitem).join("")||'<div class="c m">Rien de prévu.</div>'}${fpForm(m.id)}
<h2>Historique</h2>${is.map(hitem).join("")||'<div class="c m">Aucune intervention enregistrée.</div>'}${fiForm(m.id)}`}
function plan(){const ids=new Set(MS().map(m=>m.id)),l=todo().filter(p=>ids.has(p.mid));
return chips()+fpForm()+`<h2>À prévoir (${l.length})</h2>${l.map(pitem).join("")||'<div class="c m">Aucun travail prévu.</div>'}<p class="m">« Réalisé » enregistre le travail dans l’historique avec son coût estimé.</p>`}
function stock(){return chips()+`<form id="fs"><label>Article<input name="nom" required></label><label>Catégorie<select name="cat">${opts(S.cats.map(c=>c.n),fc||S.cats[0].n)}</select></label><label>Quantité<input name="q" type="number" min="0" value="0"></label><label>Unité<input name="u" value="pièce"></label><label>Seuil d’alerte<input name="min" type="number" min="0" value="1"></label><button class="b">Ajouter</button></form><h2>Pièces et consommables</h2>`+
S.s.filter(x=>ok(x.cat)).map(x=>`<div class="c r"><div><b>${esc(x.nom)}</b> ${x.q<=x.min?'<span class="t w">stock bas</span>':""}<div class="m">${esc(x.cat||"")} · seuil ${x.min} ${esc(x.u)}</div></div>
<div class="ac" style="margin:0"><button class="b s" data-a="sm" data-id="${x.id}">−</button><b>${x.q} ${esc(x.u)}</b><button class="b s" data-a="sp" data-id="${x.id}">+</button><button class="b d" data-a="ds" data-id="${x.id}">${armed===x.id?"Confirmer ?":"✕"}</button></div></div>`).join("")}
function inter(){const ids=new Set(MS().map(m=>m.id)),l=hist(S.i.filter(x=>ids.has(x.mid)));return chips()+fiForm()+`<h2>Historique (${l.length})</h2>`+l.map(hitem).join("")}
function render(){const lo=document.getElementById("lo"),hd=document.getElementById("hd");if(lo)lo.innerHTML=USE_FB&&authed?'<button class="b s" data-a="logout" aria-label="Déconnexion">⏻<span class="hl"> Déconnexion</span></button>':"";if(hd)hd.style.display=USE_FB&&!authed?"none":"";
if(USE_FB&&!authed){document.getElementById("nav").innerHTML="";document.getElementById("app").innerHTML=loginHtml();return}
document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-tab="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");
document.getElementById("app").innerHTML=(imp?impPanel():"")+{dash,mach,plan,stock,int:inter}[tab]()}
async function xl(only){
if(typeof XLSX==="undefined"){msg("Export Excel indisponible (bibliothèque non chargée).");return}
const ms=only?S.m.filter(m=>m.id===only):S.m,ids=new Set(ms.map(m=>m.id)),wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n);
add("Machines",[["Catégorie","Nom","Type","Précision","Année","Compteur","Unité","Entretien tous les","Dernier entretien à","Propriétaire","Orig.","Valeur estimée (€)","Note"],...ms.map(m=>[m.cat,m.nom,m.type,m.prec,m.an||"",m.h,un(m),m.iv||"",m.iv?m.last:"",m.prop,m.orig,m.val,m.note])]);
add("À prévoir",[["Machine","Catégorie","Nature","Description","Échéance","Coût estimé (€)"],...todo().filter(p=>ids.has(p.mid)).map(p=>[mn(p.mid),catOf(p.mid),tag(p),p.desc,fd(p.d),p.c])]);
add("Historique",[["Machine","Catégorie","Date","Type","Description","Coût (€)"],...hist(S.i.filter(x=>ids.has(x.mid))).map(x=>[mn(x.mid),catOf(x.mid),fd(x.d),x.t,x.desc,x.c])]);
if(!only)add("Stock",[["Article","Catégorie","Quantité","Unité","Seuil"],...S.s.map(x=>[x.nom,x.cat,x.q,x.u,x.min])]);
try{XLSX.writeFile(wb,(only?"fiche-"+mn(only).replace(/[^\w-]+/g,"-"):"parc-materiel")+".xlsx")}catch(e){msg("Export impossible.")}}
document.addEventListener("click",e=>{
const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;armed=editId=vid=eiId=epId=mg=pa=null;render();return}
const c=e.target.closest("[data-c]");if(c){fc=c.dataset.c;armed=null;render();return}
const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==="xl"){xl(id);return}
if(a==="logout"){AUTH.signOut();return}
if(a==="fiche"){vid=id;render();scrollTo(0,0);return}
if(a==="back"){vid=null;render();return}
if(a==="em"){editId=id;vid=null;tab="mach";render();scrollTo({top:0,behavior:"smooth"});return}
if(a==="cancel"){editId=null;pa=false;render();return}
if(a==="tpa"){if(editId||pa){editId=null;pa=false}else{pa=true;mg=false}render();return}
if(a==="tmg"){mg=!mg;if(mg){pa=false;editId=null}render();return}
if(a==="ei"){eiId=id;render();return}
if(a==="ecancel"){eiId=null;render();return}
if(a==="ep"){epId=id;render();return}
if(a==="epcancel"){epId=null;render();return}
if(a==="imp-no"){imp=null;armed=null;render();return}
if(a==="imp-add"||a==="imp-rep"){if(a==="imp-rep"&&armed!=="imp"){armed="imp";render();return}applyImp(a==="imp-rep"?"rep":"add");armed=null;save();render();return}
if(a==="dl"){const i=+b.dataset.i,j=+b.dataset.j,c=S.cats[i],isC=b.dataset.k==="c",nm=isC?c.n:c.t[j],use=isC?S.m.some(m=>m.cat===c.n)||S.s.some(s=>s.cat===c.n):S.m.some(m=>m.cat===c.n&&m.type===nm);
if(use){msg("« "+nm+" » est encore utilisé : changez d’abord la catégorie ou le type des éléments concernés.");mg=true;render();return}
if(isC){if(S.cats.length>1){S.cats.splice(i,1);if(fc===nm)fc=""}}else c.t.splice(j,1);mg=true;save();render();return}
if(a==="mv"){const i=+b.dataset.i,j=+b.dataset.j,dd=+b.dataset.d,l=b.dataset.k==="c"?S.cats:S.cats[i].t,k=b.dataset.k==="c"?i:j,n2=k+dd;if(n2>=0&&n2<l.length)[l[k],l[n2]]=[l[n2],l[k]];mg=true;save();render();return}
if(a==="done"){const m=mb(id);m.last=m.h}
else if(a==="sm"||a==="sp"){const x=S.s.find(x=>x.id===id);x.q=Math.max(0,x.q+(a==="sp"?1:-1))}
else if(a==="pdone"){const p=S.p.find(x=>x.id===id);p.done=true;S.i.push({id:uid(),mid:p.mid,t:p.k==="A"?"Amélioration":"Entretien",d:(document.getElementById("pd"+id)||{}).value||today(),desc:p.desc,c:(cv=>cv&&cv.value!==""?+cv.value:p.c)(document.getElementById("pc"+id))});
const m=mb(p.mid);if(m&&p.k==="E"&&m.iv>0)m.last=m.h}
else if(a==="dp")S.p=S.p.filter(x=>x.id!==id);
else if(a==="di")S.i=S.i.filter(x=>x.id!==id);
else if(a==="dm"||a==="ds"){if(armed!==id){armed=id;render();return}
if(a==="dm"){vid=null;S.m=S.m.filter(x=>x.id!==id);S.i=S.i.filter(x=>x.mid!==id);S.p=S.p.filter(x=>x.mid!==id)}else S.s=S.s.filter(x=>x.id!==id);armed=null}
save();render()});
document.addEventListener("input",e=>{if(e.target.dataset.q!==undefined){fq=e.target.value;const o=document.getElementById("ml");if(o)o.innerHTML=mlist()}});
document.addEventListener("change",e=>{const d=e.target.dataset;
if(d.h){mb(d.h).h=+e.target.value||0}else if(d.cs){const c=S.cats.find(x=>x.n===e.target.value);e.target.form.elements.namedItem("type").innerHTML='<option value="">— aucun —</option>'+opts(c?c.t:[],"");return}
else if(d.imp){const f=e.target.files[0],inp=e.target;if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:"array"});if(!wb.Sheets["Machines"])throw 0;imp={wb,name:f.name};armed=null}catch(x){msg("Fichier non reconnu : il faut un export AgriParc avec une feuille « Machines ».")}inp.value="";render()};rd.readAsArrayBuffer(f);return}
else if(d.rn){const i=+d.i,j=+d.j,v=e.target.value.trim(),c=S.cats[i];
if(v){if(d.rn==="c"){if(!S.cats.some(x=>x.n===v)){const o=c.n;c.n=v;S.m.forEach(m=>{if(m.cat===o)m.cat=v});S.s.forEach(s=>{if(s.cat===o)s.cat=v});if(fc===o)fc=v}}else if(!c.t.includes(v)){const o=c.t[j];c.t[j]=v;S.m.forEach(m=>{if(m.cat===c.n&&m.type===o)m.type=v})}}mg=true}else if(d.f){fo=e.target.value;render();return}else return;save();render()});
document.addEventListener("submit",e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),n=e.target.id;
if(n==="fa"){AUTH.signInWithEmailAndPassword(f.email.trim(),f.pw).catch(()=>msg("E-mail ou mot de passe incorrect."));return}
if(n==="fm"){const m=mb(editId),v={nom:f.nom,type:f.type,cat:f.cat,prec:f.prec,an:+f.an||0,h:+f.h||0,u:f.u,iv:+f.iv||0,orig:f.orig,prop:f.prop,val:+f.val||0,note:f.note};
if(m){if(!m.iv&&v.iv)v.last=v.h;Object.assign(m,v);editId=null}else S.m.push({id:uid(),...v,last:v.h});pa=false}
if(n==="fl"){const x=f.nom.trim();if(x){if(f.kind==="cat"){if(!S.cats.some(c=>c.n===x))S.cats.push({n:x,t:[]})}else{const c=S.cats.find(c=>c.n===f.pc);if(c&&!c.t.includes(x))c.t.push(x)}}mg=true}
if(n==="fq"){const x=S.p.find(y=>y.id===f.id);if(x)Object.assign(x,{mid:f.mid,k:f.k,desc:f.desc,d:f.d,c:+f.c||0});epId=null}
if(n==="fe"){const x=S.i.find(y=>y.id===f.id);if(x)Object.assign(x,{mid:f.mid,t:f.t,d:f.d===pad(f.d0)?f.d0:(f.d||f.d0),desc:f.desc,c:+f.c||0});eiId=null}
if(n==="fs")S.s.push({id:uid(),nom:f.nom,cat:f.cat,q:+f.q||0,u:f.u||"pièce",min:+f.min||0});
if(n==="fi")S.i.push({id:uid(),mid:f.mid,t:f.t,d:f.d||today(),desc:f.desc,c:+f.c||0});
if(n==="fp")S.p.push({id:uid(),mid:f.mid,k:f.k,desc:f.desc,d:f.d,c:+f.c||0});
save();render()});
render();boot();
</script></body></html>
